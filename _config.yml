tag_map:

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: redefine

# Markdown renderer (hexo-renderer-marked)
marked:
  gfm: true
  breaks: false
  prependRoot: true
  postAsset: false
  lazyload: false

# KaTeX (hexo-filter-katex) — build-time LaTeX -> static HTML+CSS (swup-safe,
# stateless, fast). Renders $...$ inline and $$...$$ display on all posts;
# CSS is auto-injected into <head>. The legacy `mathjax: true` front-matter
# flag is harmless/ignored.
katex:
  render_options:
    throwOnError: false
    strict: false

# Atom feed (hexo-generator-feed) — replaces jekyll-feed
feed:
  type: atom
  path: feed.xml
  limit: 20
  hub:
  content: true

# Sitemap (hexo-generator-sitemap) — replaces jekyll-sitemap
sitemap:
  path: sitemap.xml
  # A custom generator in scripts/seo-governance.js emits a language-aware
  # sitemap index plus zh/en child sitemaps. Taxonomy allowlists live below.
  tags: false
  categories: false

# Search visibility policy. Pages remain navigable when noindexed.
seo:
  min_category_posts: 3
  index_pages:
    - /
    - /categories/
    - /me/
    - /cv/
    - /projects/
    - /photos/
    - /footprints/
    - /murmur/
  noindex_pages:
    - /404.html
    - /comments/
    - /friends/
    - /tags/
  # Provisional keep-list based on corpus depth. Search Console data can add
  # tags with proven clicks/backlinks even when they fall below the threshold.
  index_tags:
    - Statistics
    - Machine Learning
    - Evaluation
    - Survey
    - Statistical Thinking
    - Context Engineering
    - Data Curation
    - Reward Modeling
    - Time Series
    - Alignment
    - Research Methods
    - Series
    - Tool Use
    - Linear Models
    - R
    - Retrieval
    - Multimodality
    - Tutorial
    - Reinforcement Learning
    - Product Thinking
    - Software Engineering
    - AI Agent
    - Regression
    - Interpretability
    - Paper Notes
    - Hugging Face
    - Fine-Tuning
    - Memory
    - Sci-Fi
    - AI Engineering
  tag_aliases:
    AI Products: AI Product
    Coding Agent: AI Coding
    Coding Agents: AI Coding
    Agent Evaluation: Evaluation
    Evals: Evaluation
