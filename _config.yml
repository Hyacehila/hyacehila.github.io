# Hexo Configuration — https://hexo.io/docs/configuration
# Migrated from Jekyll. Theme: Redefine (hexo-theme-redefine).

# Site
title: "Hyacehila's Blog"
subtitle: 'Essays of a Boring Person'
description: '关于 AI 智能体、大语言模型、数据科学、统计学与软件工程的个人技术博客。'
keywords: 'AI 智能体, 大语言模型, 数据科学, 统计学, 机器学习, 软件工程, 个人博客'
author: Hyacehila
language: zh-CN
timezone: Asia/Shanghai

# URL
## Site served at the domain root (user pages repo).
url: https://hyacehila.github.io
root: /
## Preserve legacy Jekyll post URLs. Legacy 104 posts carry an explicit
## per-post `permalink:`; this pattern is only the fallback for future posts.
permalink: /blog/:year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true   # keep .../index.html so output matches Jekyll _site
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - 'assets/**/*.json'   # never let Hexo tag-parse data files
  - 'assets/**/*.js'
ignore:
  # This handbook is a standalone draft without Hexo front matter. Keep it in
  # the repository without letting the post processor interpret its thematic
  # horizontal rule as a YAML delimiter.
  - '**/_drafts/UE_UI_VFX_TA_Starter_Handbook.md'

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0          # MUST stay 0 — preserves LLM/SOTA/Re0HF case in URLs
render_drafts: false      # drafts stay in repo (source/_drafts) but are NOT published
post_asset_folder: false
relative_link: false
future: true              # all posts are past-dated; render them all
updated_option: empty     # only expose each post's authored date, never filesystem mtime
highlight:
  enable: false           # Redefine ships its own highlighter
prismjs:
  enable: false

# Home page index
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
