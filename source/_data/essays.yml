- date: 2026-02-28 12:00:00
  content: |-
    不能同时锁死要解决的问题和用来解决问题的方法，否则可能会在错误的路上一直走下去。可以研究一类方法，成为其中的高手，再尝试用它解决问题；也可以尝试不同的方式，去解决同一类问题。这两种方向都值得研究。接受失败，同时保持初心，去做最初想做的东西。

