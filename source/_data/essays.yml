- date: 2026-08-13 12:00:00
  content: |-
    做技术，当然要有自己的 Belief；做 Agent，更是如此。架构层面的决定必须由人来做——在这么早的阶段就引入 A/B test，显然并不靠谱。

    有 Belief 并不意味着固执。我会接受每一次失败，并尝试据此修正自己的 Belief。失败意味着还能学到新的东西，值得珍惜。
